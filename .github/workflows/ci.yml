name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install -D esbuild
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6

      - name: Create env files
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SIGNED_URL_SECRET: ${{ secrets.SIGNED_URL_SECRET }}
          GEMINI_API_KEY_PRIMARY: ${{ secrets.GEMINI_API_KEY_PRIMARY }}
        run: |
          cat > backend/.env <<EOF
          NODE_ENV=production
          PORT=4000
          FRONTEND_URL=http://localhost:5173
          MONGODB_URI=$MONGODB_URI
          MONGODB_DB_NAME=hirezilla_ci
          SESSION_SECRET=$SESSION_SECRET
          SIGNED_URL_SECRET=$SIGNED_URL_SECRET
          GEMINI_API_KEY_PRIMARY=$GEMINI_API_KEY_PRIMARY
          ALLOW_LOCAL_DB_FALLBACK=false
          AUTH_PASSWORD_ENABLED=true
          AI_REQUEST_TIMEOUT_MS=25000
          AI_MAX_RETRIES=2
          EOF
          cat > frontend/.env <<EOF
          PORT=5173
          BACKEND_URL=http://backend:4000
          EOF

      - name: Build images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Smoke test
        run: |
          curl -sf --retry 15 --retry-delay 2 --retry-connrefused http://localhost:5173/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/auth/me)
          echo "api via proxy: $code"
          test "$code" != "502" -a "$code" != "000"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down