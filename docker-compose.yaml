services:
  backend:
    image: hirezilla-backend:v1
    build: 
      context: .
      dockerfile: backend/Dockerfile


    ports:
    - 4000:4000

    env_file:
    - ./backend/.env
  frontend:
    image: hirezilla-frontend:v1

    build: 
      context: .
      dockerfile: frontend/Dockerfile

    ports:
    - 5173:5173

    env_file:
    - ./frontend/.env


